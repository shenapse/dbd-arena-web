  deny:
    - Leprose Lichen

survivorPerks:
  default: deny
  allow:
    - Adrenaline
    - Aftercare
    - Any Means Necessary
    - Balanced Landing
    - Better than New
    - Bite the Bullet
    - Blood Pact
    - Bond
    - Calm Spirit
    - Clean Break
    - Counterforce
    - Detective's Hunch
    - Distortion
    - Empathic Connection
    - Empathy
    - Five Moves Ahead
    - Finesse
    - Fixated
    - Flashbang
    - Head On
    - Iron Will
    - Light-Footed
    - Lithe
    - Lucky Star
    - Mettle of Man
    - No Mither
    - Parental Guidance
    - Quick and Quiet
    - Repressed Alliance
    - Saboteur
    - Smash Hit
    - Tenacity
    - Urban Evasion
    - Visionary
    - Windows of Opportunity
  deny: []

survivorRepetitionLimits:
  - scope: team
    max: 1
    perks: all

items:
  Med-Kit:
    default: deny
  Flashlight:
    count: 1
    default: deny
    allow:
      - Sport Flashlight
    addons:
      count: 2
      default: deny
      allow:
        - {rarity: "Common"}
  Toolbox:
    default: deny
  Key:
    default: deny
  Map:
    default: deny
  Firecracker:
    count: 1
    allow:
      - Firecracker
  Fog Vial:
    default: deny

itemDuplicateLimits:
  - scope: team
    max: 1
    items: all
