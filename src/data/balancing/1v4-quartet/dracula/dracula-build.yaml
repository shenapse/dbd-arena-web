  - Bite the Bullet
  - Bond
  - Chemical Trap
  - Clean Break
  - Counterforce
  # - Deliverance
  - Desperate Measures
  - Detective's Hunch
  - Empathic Connection
  - Empathy
  - Flashbang
  - Finesse
  - Five Moves Ahead
  - Fixated
  - Flow State
  - For The People
  - Head On
  - Inner Strength
  - Leader
  - Lithe
  - Lucky Star
  - No Mither
  - Open Handed
  - Quick and Quiet
  # - Second Wind
  - Smash Hit
  - Sprint Burst
  - Tenacity
  - Urban Evasion
  - Visionary
