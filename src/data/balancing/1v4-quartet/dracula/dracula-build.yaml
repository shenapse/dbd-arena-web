  - Brutal Strength
  - Call of Brine
  - Corrupt Intervention
  - Coulrophobia
  - Deathbound
  - Dying Light
  - Eruption
  - "Hex: Crowd Control"
  - "Hex: Huntress Lullaby"
  - "Hex: Ruin"
  - "Hex: The Third Seal"
  - "Hex: Undying"
  - Infectious Fright
  - Leverage
  - Oppression
  - Overcharge
  - Pop Goes the Weasel
  - "Scourge Hook: Gift of Pain"
  - "Scourge Hook: Pain Resonance"
  - "Scourge Hook: Jagged Compass"
  - Sloppy Butcher
  - Surge
  - Surveillance
  - Thanatophobia
  - Thrilling Tremors
