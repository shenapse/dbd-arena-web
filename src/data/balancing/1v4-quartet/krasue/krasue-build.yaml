    max: 1
    perks: all
      
items:
  Flashlight:
    count: 1
    default: deny
    allow:
      - Sport Flashlight
    addons:
      count: 2
      default: deny
      allow:
        - {rarity: "Common"}
  Med-Kit:
    default: deny
  Firecracker:
    count: 1
    allow:
      - Firecracker
  Toolbox:
    default: deny
  Key:
    default: deny
  Map:
    default: deny
  Fog Vial:
    default: deny

itemDuplicateLimits:
