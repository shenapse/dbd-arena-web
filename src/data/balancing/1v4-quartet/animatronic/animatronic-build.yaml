  deny:
    - Iridescent Remnant
    - Loot Bag
    - Access Panel
    - Bonnie's Guitar Strings
    - Purple Guy Drawing
    - Chica's Bib

survivorPerks:
  default: deny
  allow:
    - Aftercare
    - Any Means Necessary
    - Better than New
    - Bite the Bullet
    - Blood Pact
    - Bond
    - Calm Spirit
    - Counterforce
    - Detective's Hunch
    - Distortion
    - Empathy
    - Five Moves Ahead
    - Fixated
    - Flashbang
    - Head On
    - Light-Footed
    - Lucky Star
    - No Mither
    - Quick and Quiet
    - Repressed Alliance
    - Saboteur
    - Urban Evasion
    - Visionary
    - Windows of Opportunity
