  deny:
    - {rarity: "Ultra Rare"}

survivorPerks:
  default: deny
  allow:
    - Aftercare
    - Any Means Necessary
    - Better than New
    - Bite the Bullet
    - Blood Pact
    - Bond
    # - Calm Spirit
    - Counterforce
    - Detective's Hunch
    - Distortion
    - Empathy
    - Five Moves Ahead
    - Fixated
    - Flashbang
    - Head On
    - Light-Footed
    - Lucky Star
    - No Mither
    - Quick and Quiet
    - Repressed Alliance
    - Saboteur
    - Urban Evasion
    - Visionary
    - Windows of Opportunity

