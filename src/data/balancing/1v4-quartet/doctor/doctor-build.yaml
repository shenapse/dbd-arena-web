    - Dying Light
    - Eruption
    - Forced Hesitation
    - Forced Penance
    - Furtive Chase
    - Grim Embrace
    - "Hex: Crowd Control"
    - "Hex: Pentimento"
    - "Hex: Ruin"
    - "Hex: Huntress Lullaby"
    - "Hex: The Third Seal"
    - "Hex: Undying"
    - Hysteria
    - Infectious Fright
    - Keep Them Waiting
    - Leverage
    - Machine Learning
    - Monitor and Abuse
    - Oppression
    - Overcharge
    - Pop Goes the Weasel
    - Rapid Brutality
