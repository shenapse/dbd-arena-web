survivorRepetitionLimits:
  - scope: team
    max: 1
    perks: all

items:
  Med-Kit:
    default: deny
  Flashlight:
    default: deny
  Toolbox:
    default: deny
  Key:
    default: deny
  Map:
    default: deny
  Firecracker:
    default: deny
  Fog Vial:
    default: deny

itemDuplicateLimits:
  - scope: team
    max: 1
    items: all
