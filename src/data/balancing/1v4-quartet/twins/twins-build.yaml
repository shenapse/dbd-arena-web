killer: The Twins
balancing: DBD Arena - 1v4 Quartet Rank v0.1
# universe is optional; defaults to every perk in dbdperks.json for each side.
# universe:
#   killer: all
#   survivor: all

display:
  killerPerks: allow
  survivorPerks: allow
  addons: ban
  items: allow

killerPerks:
  default: deny
  allow:
    - Bamboozle
    - Blood Echo
    - Brutal Strength
    - Call of Brine
    - Corrupt Intervention
    - Coulrophobia
    - Deadlock
    - Deathbound
    - Dying Light
    - Dragon's Grip
    - Eruption
    - Forced Hesitation
    - Forced Penance
    - Furtive Chase
    - "Hex: Crowd Control"
    - "Hex: Huntress Lullaby"
    - "Hex: The Third Seal"
    - Hysteria
    - Infectious Fright
    - Leverage
    - Machine Learning
    - Make Your Choice
    - Monitor and Abuse
    - Oppression
    - Overcharge
    - Pop Goes the Weasel
    - Secret Project
    - "Scourge Hook: Gift of Pain"
    - "Scourge Hook: Pain Resonance"
    - "Scourge Hook: Jagged Compass"
    - Sloppy Butcher
    - Surge
    - Surveillance
    - Thanatophobia
    - Thrilling Tremors
    - Tinkerer
    - Trail of Torment
    - Turn Back the Clock

addons:
  default: allow
  deny:
    - {rarity: "Ultra Rare"}
    - Victor's Soldier
    - Weighty Rattle

survivorPerks:
  default: deny
  allow:
    - Adrenaline
    - Aftercare
    - Any Means Necessary
    - Bada Bada Boom
    - Balanced Landing
    - Better than New
    - Bite the Bullet
    - Blood Pact
    # - Boil Over
    - Bond
    #- Botany Knowledge
    - Calm Spirit
    - Champion of Light
    - Chemical Trap
    - Clean Break
    - Counterforce
    - Cut Loose
    - Dance with Me
    # - Dead Hard
    # - Desperate Measures
    - Detective's Hunch
    - Distortion
    - Diversion
    # - Empathic Connection
    - Five Moves Ahead
    - Fixated
    - Flashbang
    # - Flow State
    # - For the People
    - Head On
    # - Inner Strength
    - Iron Will
    # - Leader
    - Light-Footed
    - Lithe
    - Lucky Star
    - No Mither
    - Parental Guidance
    - Quick and Quiet
    - Rapid Response
    - Repressed Alliance
    # - Residual Manifest
    - Saboteur
    # - Second Wind
    - Smash Hit
    - Sprint Burst
    - Tenacity
    - Urban Evasion
    - Visionary
    - Windows of Opportunity
  deny: []

survivorRepetitionLimits:
  - scope: team
    max: 1
    perks: all

items:
  Flashlight:
    count: 1
    default: deny
    allow:
      - Sport Flashlight
    addons:
      count: 2
      default: deny
      allow:
        - {rarity: "Common"}
  Firecracker:
    count: 1
    allow:
      - Firecracker
  Med-Kit:
    count: 1
    default: deny
    allow:
      - Ranger Med-Kit
    addons:
      default: deny
  Toolbox:
    default: deny
  Key:
    default: deny
  Map:
    default: deny
  Fog Vial:
    default: deny

itemDuplicateLimits:
  - scope: team
    max: 1
    items: all