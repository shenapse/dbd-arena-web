  default: allow
  deny:
    - {rarity: "Ultra Rare"}
    - Cigar Box

survivorPerks:
  default: deny
  allow:
    - Aftercare
    - Any Means Necessary
    - Bada Bada Boom
    # - Balanced Landing
    - Better than New
    - Bite the Bullet
    - Blood Pact
    - Boil Over
    - Bond
    - Calm Spirit
    - Chemical Trap
    - Counterforce
    - Detective's Hunch
    - Distortion
    - Diversion
    - Empathy
    - Finesse
    - Five Moves Ahead
    - Fixated
    - Flashbang
    - Head On
    # - Lithe
    - Light-Footed
    - Lucky Star
    - No Mither
    # - No One Left Behind
    - Quick and Quiet
    - Repressed Alliance
    - Saboteur
    - Smash Hit
    - Tenacity
    - Urban Evasion
    - Visionary
    - Windows of Opportunity

survivorRepetitionLimits:
  - scope: team
    max: 1
    perks: all
      
items:
  Med-Kit:
    default: deny
  Flashlight:
    default: deny
    allow:
      - Sport Flashlight
    addons:
      default: deny
      allow:
        - {rarity: "Common"}
  Toolbox:
    default: deny
  Key:
    default: deny
  Map:
    default: deny
  Firecracker:
    allow:
      - Firecracker
  Fog Vial:
    default: deny

itemDuplicateLimits:
  - scope: team
    max: 1
    items: all