killer: The Clown
balancing: DBD Arena - 1v4 Quartet Rank v0.1
# universe is optional; defaults to every perk in dbdperks.json for each side.
# universe:
#   killer: all
#   survivor: all

display:
  killerPerks: allow
  survivorPerks: allow
  addons: ban
  items: allow

killerPerks:
  default: deny
  allow:
    - Agitation
    - Bamboozle
    - Blood Echo
    - Brutal Strength
    - Call of Brine
    - Corrupt Intervention
    - Coulrophobia
    - Deadlock
    - Deathbound
    - Dragon's Grip
    - Dying Light
    - Eruption
    - Forced Penance
    - Furtive Chase
    - Grim Embrace
    - "Hex: Crowd Control"
    - "Hex: Ruin"
    - "Hex: Huntress Lullaby"
    - "Hex: The Third Seal"
    - "Hex: Undying"
    - Hysteria
    - Infectious Fright
    - Keep Them Waiting
    - Leverage
    - Machine Learning
    - Monitor and Abuse
    - Oppression
    - Overcharge
    - Pop Goes the Weasel
    - Rapid Brutality
    - "Scourge Hook: Gift of Pain"
    - "Scourge Hook: Pain Resonance"
    - "Scourge Hook: Jagged Compass"
    - Sloppy Butcher
    - Superior Anatomy
    - Surge
    - Surveillance
    - Thanatophobia
    - Thrilling Tremors
    - Tinkerer
    - Trail of Torment
    - Turn Back the Clock

